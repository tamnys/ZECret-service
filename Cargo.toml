[workspace]
resolver = "2"
members = ["crates/protocol", "crates/verifier", "crates/transport", "crates/client", "crates/server", "crates/lifecycle", "crates/cli", "crates/uki-digest", "crates/payments", "crates/wallet-read", "crates/wallet-sdk", "crates/wallet-reference"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "sync", "time"] }
getrandom = "=0.3.4"
tokio-socks = { version = "=0.5.3", default-features = false, features = ["tokio"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
zeroize = "=1.9.0"
percent-encoding = "=2.3.2"
# The internal node adapter uses an already-connected loopback socket, no resolver.
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
base64 = "=0.22.1"
libc = "=0.2.189"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Maintained header/transaction decoding and identifier calculation only.
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.0", default-features = false }
zcash_address = { version = "=0.14.0-pre.0", default-features = false }
zcash_client_backend = { version = "=0.25.0-pre.0", default-features = false, features = ["orchard", "transparent-inputs", "sync", "lightwalletd-tonic-transport"] }
zcash_client_sqlite = { version = "=0.23.0-pre.0", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_keys = { version = "=0.17.0-pre.0", default-features = false, features = ["orchard", "transparent-inputs"] }
async-trait = "=0.1.92"
rand_core = "=0.10.0"

# Maintained dstack runtime-event encoding/replay, pinned to the catalog OS source.
cc-eventlog = { git = "https://github.com/Dstack-TEE/dstack", rev = "282eeb27d22d8f091ad0fa5a90e638f85cf68751", version = "=0.5.9" }
dstack-sdk-types = { git = "https://github.com/Dstack-TEE/dstack", rev = "282eeb27d22d8f091ad0fa5a90e638f85cf68751", version = "=0.1.2" }
ez-hash = "=1.1.0"
hex = "=0.4.3"
sha2 = "=0.10.9"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
authenticode = { version = "=0.6.0", default-features = false, features = ["object", "std"] }
object = { version = "=0.39.0", default-features = false, features = ["elf", "pe", "read_core", "unaligned"] }

# Offline quote verification only: no PCCS/HTTP fetch or permissive TCB override.
dcap-qvl = { version = "=0.6.3", default-features = false, features = ["std", "ring", "default-x509"] }
parity-scale-codec = { version = "=3.7.5", default-features = false, features = ["std"] }
prost = "=0.14.3"
prost-build = "=0.14.3"
protoc-bin-vendored = "=3.2.0"
futures-util = "=0.3.34"
subtle = "=2.6.1"
tonic = { version = "=0.14.5", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = "=0.14.5"
tonic-prost-build = "=0.14.5"
